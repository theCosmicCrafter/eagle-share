<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eagle Share</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#1c1c1e; --panel:#262628; --hover:#323235; --text:#e8e8ea;
          --dim:#9a9aa0; --accent:#4f8ef7; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { display:flex; gap:10px; align-items:center; padding:10px 14px;
           background:var(--panel); border-bottom:1px solid #333; }
  header h1 { font-size:16px; font-weight:600; white-space:nowrap; }
  #search { flex:1; padding:8px 12px; border-radius:8px; border:1px solid #3a3a3d;
            background:#1c1c1e; color:var(--text); font-size:15px; min-width:0; }
  #count { font-size:12px; color:var(--dim); white-space:nowrap; }
  main { display:flex; flex:1; min-height:0; }
  #sidebar { width:230px; overflow-y:auto; background:var(--panel); padding:10px;
             border-right:1px solid #333; flex-shrink:0; }
  .sidehead { font-size:11px; text-transform:uppercase; color:var(--dim);
              letter-spacing:.06em; margin:14px 0 6px; }
  .nav { padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nav:hover { background:var(--hover); }
  .nav.active { background:var(--accent); color:#fff; }
  .nav .cnt { float:right; color:var(--dim); font-size:11px; }
  .nav.active .cnt { color:#dfeeff; }
  .indent1 { padding-left:22px; } .indent2 { padding-left:36px; } .indent3 { padding-left:50px; }
  #grid { flex:1; overflow-y:auto; padding:12px;
          display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
          grid-auto-rows:175px; gap:10px; align-content:start; }
  .cell { background:#2a2a2d; border:1px solid #3d3d42; border-radius:8px;
          overflow:hidden; cursor:pointer; position:relative; }
  .cell img { position:absolute; top:0; left:0; width:100%; height:100%;
              object-fit:cover; display:block; }
  .cell .nm { position:absolute; left:0; right:0; bottom:0; padding:4px 6px; font-size:10px;
              background:linear-gradient(transparent,rgba(0,0,0,.75)); color:#eee;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #empty { grid-column:1/-1; text-align:center; color:var(--dim); padding:60px 0; font-size:14px; }
  /* lightbox */
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; z-index:50;
        flex-direction:column; }
  #lb.on { display:flex; }
  #lb-top { display:flex; justify-content:space-between; padding:10px 14px; gap:10px; }
  #lb-title { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  #lb img { max-width:100%; max-height:62vh; object-fit:contain; margin:0 auto; }
  #lb-info { overflow-y:auto; padding:12px 16px 30px; font-size:13px; color:#cfcfd4; }
  #lb-tags { margin:10px 0; }
  .chip { display:inline-block; background:#333; border-radius:20px; padding:4px 12px;
          margin:3px 3px 0 0; font-size:12px; }
  #lb-ann { white-space:pre-wrap; line-height:1.5; color:var(--dim); margin-top:10px; }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px;
         padding:8px 16px; font-size:14px; cursor:pointer; text-decoration:none; }
  .btn2 { background:var(--hover); }
  #lb-nav { display:flex; gap:8px; flex-shrink:0; }
  @media (max-width:700px) {
    #sidebar { position:fixed; left:-260px; top:0; bottom:0; z-index:40; width:240px;
               transition:left .2s; box-shadow:4px 0 20px rgba(0,0,0,.5); }
    #sidebar.open { left:0; }
    #menuBtn { display:block; }
    #grid { grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
            grid-auto-rows:112px; gap:6px; padding:8px; }
  }
  #menuBtn { display:none; background:var(--hover); color:var(--text); border:0;
             border-radius:8px; padding:8px 12px; font-size:16px; }
</style>
</head>
<body>
<header>
  <button id="menuBtn">☰</button>
  <h1>Eagle Share</h1>
  <input id="search" type="search" placeholder="Search names, tags, descriptions…">
  <span id="count"></span>
</header>
<main>
  <div id="sidebar">
    <div class="sidehead">Library</div>
    <div class="nav active" data-kind="all">All Images <span class="cnt" id="allcnt"></span></div>
    <div class="sidehead">Folders</div>
    <div id="folders"></div>
    <div class="sidehead">Tags</div>
    <div id="tags"></div>
  </div>
  <div id="grid"></div>
</main>
<div id="lb">
  <div id="lb-top">
    <div id="lb-title"></div>
    <div id="lb-nav">
      <a class="btn" id="lb-dl" href="#">Download</a>
      <button class="btn btn2" id="lb-prev">‹</button>
      <button class="btn btn2" id="lb-next">›</button>
      <button class="btn btn2" id="lb-close">✕</button>
    </div>
  </div>
  <img id="lb-img" src="" alt="">
  <div id="lb-info">
    <div id="lb-tags"></div>
    <div id="lb-ann"></div>
  </div>
</div>
<script>
let items = [], total = 0, offset = 0, loading = false, done = false;
let filt = {kind:'all', val:''}, query = '', fmap = {}, lbIdx = -1;
const grid = document.getElementById('grid');

async function api(url){
  const r = await fetch(url);
  if(r.status===401){ location.reload(); return {}; }
  return r.json();
}

function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

async function loadMeta(){
  const m = await api('/api/meta');
  if(!m.fmap) return;
  fmap = m.fmap; document.getElementById('allcnt').textContent = m.total;
  document.getElementById('count').textContent = m.scanning ? 'indexing '+m.progress+'…' : '';
  const fdiv = document.getElementById('folders');
  fdiv.innerHTML = '';
  function walk(nodes, depth){
    for(const n of nodes){
      const d = document.createElement('div');
      d.className = 'nav indent'+Math.min(depth,3);
      d.dataset.kind='folder'; d.dataset.val=n.id;
      d.textContent = n.name;
      d.onclick = ()=>setFilter('folder',n.id,d);
      fdiv.appendChild(d);
      if(n.children && n.children.length) walk(n.children, depth+1);
    }
  }
  walk(m.folders,0);
  const tdiv = document.getElementById('tags');
  tdiv.innerHTML = '';
  for(const [t,c] of m.tags.slice(0,300)){
    const d = document.createElement('div');
    d.className='nav'; d.dataset.kind='tag';
    d.innerHTML = esc(t)+' <span class="cnt">'+c+'</span>';
    d.onclick = ()=>setFilter('tag',t,d);
    tdiv.appendChild(d);
  }
}

function setFilter(kind,val,el){
  filt={kind,val};
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  reload();
}

async function loadMore(){
  if(loading||done) return; loading=true;
  const p = new URLSearchParams({offset,limit:120});
  if(query) p.set('q',query);
  if(filt.kind==='tag') p.set('tag',filt.val);
  if(filt.kind==='folder') p.set('folder',filt.val);
  const r = await api('/api/items?'+p);
  if(!r.items){ loading=false; return; }
  total = r.total;
  document.getElementById('count').textContent = total+' items';
  if(offset===0) grid.innerHTML='';
  if(!r.items.length && offset===0)
    grid.innerHTML='<div id="empty">No images match.</div>';
  for(const it of r.items){
    const c = document.createElement('div');
    c.className='cell';
    c.innerHTML = `<img loading="lazy" src="/thumb/${it.id}" onerror="this.style.display='none'">`+
                  `<div class="nm">${esc(it.name)}</div>`;
    c.onclick = ()=>openLB(items.indexOf(it));
    items.push(it); grid.appendChild(c);
  }
  offset += r.items.length;
  if(offset>=total) done=true;
  loading=false;
}

function reload(){ items=[]; offset=0; done=false; loadMore(); }

grid.addEventListener('scroll',()=>{
  if(grid.scrollTop+grid.clientHeight > grid.scrollHeight-800) loadMore();
});

let searchT;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(searchT);
  searchT=setTimeout(()=>{query=e.target.value.trim(); reload();},350);
});

document.getElementById('menuBtn').onclick=()=>
  document.getElementById('sidebar').classList.toggle('open');
document.querySelector('[data-kind="all"]').onclick=function(){setFilter('all','',this)};

// lightbox
const lb=document.getElementById('lb'), lbi=document.getElementById('lb-img');
function openLB(i){
  if(i<0||i>=items.length) return; lbIdx=i;
  const it=items[i];
  lbi.src='/img/'+it.id;
  document.getElementById('lb-title').textContent=it.name+'.'+it.ext;
  document.getElementById('lb-dl').href='/dl/'+it.id;
  document.getElementById('lb-tags').innerHTML=it.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('');
  document.getElementById('lb-ann').textContent=it.annotation;
  lb.classList.add('on');
}
document.getElementById('lb-close').onclick=()=>{lb.classList.remove('on');lbi.src='';};
document.getElementById('lb-prev').onclick=e=>{e.stopPropagation();openLB(lbIdx-1);};
document.getElementById('lb-next').onclick=e=>{e.stopPropagation();openLB(lbIdx+1);};
lb.onclick=e=>{if(e.target===lb){lb.classList.remove('on');lbi.src='';}};

loadMeta().then(reload);
</script>
</body>
</html>
